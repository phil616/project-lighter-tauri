name: Windows Portable Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Qt Windows x64 portable
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Check source-only repository
        run: python packaging/check_source_tree.py
      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          add-tools-to-path: true
          cache: true
      - name: Configure
        run: |
          $compiler = Join-Path $env:IQTA_TOOLS 'mingw1310_64/bin/g++.exe'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_COMPILER=$compiler" "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Deploy portable executable and runtime
        run: cmake --install build --prefix dist/windows
      - name: Upload portable directory
        uses: actions/upload-artifact@v4
        with:
          name: lighter-windows-x64-portable
          path: dist/windows/
          if-no-files-found: error
          retention-days: 14
